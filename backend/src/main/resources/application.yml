spring:
  application:
    name: deskpilot
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Knowledge-base documents (12b); larger uploads get 413 Payload Too Large.
      max-file-size: 10MB
      max-request-size: 11MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  http:
    clients:
      # Local models on CPU are slow; a multi-tool answer can take minutes.
      connect-timeout: 5s
      read-timeout: 5m
  # Datasource: provided by Docker Compose (compose.yaml) in development,
  # by Testcontainers in tests, and by SPRING_DATASOURCE_* environment variables in production.
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from compose.yaml; the browser and the backend must see the same URL.
          issuer-uri: ${DESKPILOT_ISSUER_URI:http://localhost:8180/realms/deskpilot}
  mail:
    # Mailpit from compose.yaml in development (web UI: http://localhost:8026).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
    properties:
      # A slow or stopped mail server must not hold a notification thread for long.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  ai:
    mcp:
      server:
        # DeskPilot as an MCP server on /mcp (Streamable HTTP), secured by the JWT resource server (role user).
        name: deskpilot
        version: 1.0.0
        protocol: streamable
        instructions: Read-only access to Example Corp's IT helpdesk knowledge base. Answer only from the returned articles.
        capabilities:
          resource: false
          prompt: false
          completion: false
      client:
        # External MCP servers whose tools the agent may use (always behind a human approval).
        # None by default; see the README for examples (spring.ai.mcp.client.streamable-http.connections.*).
        name: deskpilot
        request-timeout: 30s
    retry:
      # Spring AI's default (10 attempts, backoff x5 with no maximum) can hang a request for an hour when Ollama
      # is down. One retry after a short pause, then the user gets "Model unavailable" (502).
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    chat:
      memory:
        repository:
          jdbc:
            # Table created by Flyway (V3), not by Spring AI.
            initialize-schema: never
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Models are pulled manually (`ollama pull ...`); never download gigabytes at startup.
        pull-model-strategy: never
      chat:
        model: ${AGENT_CHAT_MODEL:qwen3:8b}
        temperature: 0.2
        keep-alive: 30m
        # Reasoning mode is ~15x slower on CPU (44s vs 3s for a one-word answer); enable only on a GPU.
        think: ${AGENT_THINK:false}
      embedding:
        model: ${AGENT_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        # nomic-embed-text produces 768-dimensional vectors; change together with the embedding model.
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      # Every request is traced: traffic is low and each agent run is worth inspecting.
      probability: 1.0
    export:
      enabled: ${TRACING_EXPORT_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger from compose.yaml (UI on http://localhost:16686).
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Grafana (optional grafana/otel-lgtm in compose.yaml, profile "grafana", http://localhost:3000): dashboards and
        # alerts on these metrics. Off by default; they always stay on /actuator/metrics and /api/metrics.
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4328/v1/metrics}
        step: ${OTEL_METRICS_STEP:15s}
  logging:
    export:
      otlp:
        enabled: false
  health:
    mail:
      # A stopped mail server must not mark the whole application DOWN; sending failures are only logged.
      enabled: false
  endpoint:
    health:
      # Public: overall and per-component status (the UI shows whether the model is online). Details: admins only.
      show-components: always
      show-details: when-authorized
      roles: admin

agent:
  max-iterations: 8
  # Master key (base64 of 32 bytes) encrypting the cloud API keys stored from the UI; generated into
  # ~/.deskpilot/secret.key when empty (development only).
  secret-key: ${DESKPILOT_SECRET_KEY:}
  # Guardrails v2 (12n)
  rate-limit:
    # Chat messages and approval decisions per user (admins are not limited); 0 = off.
    per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    per-day: ${RATE_LIMIT_PER_DAY:100}
  model-circuit-breaker:
    # After this many model failures in a row (unreachable, timeout, 5xx), calls fail fast for open-duration.
    enabled: true
    failure-threshold: 5
    open-duration: 30s
  moderation:
    # Ask the model to classify each message as SAFE/UNSAFE before the agent runs (one extra call per message).
    enabled: ${MODERATION_ENABLED:false}
    model: ${MODERATION_MODEL:}
  notifications:
    # E-mails to reviewers (approval needed), requesters (ticket created) and admins (approval overdue).
    enabled: ${NOTIFICATIONS_ENABLED:true}
    reviewers: ${NOTIFICATIONS_REVIEWERS:bob@example.com,admin@example.com}
    admins: ${NOTIFICATIONS_ADMINS:admin@example.com}
    approval-sla: ${NOTIFICATIONS_APPROVAL_SLA:PT30M}
    webhook-url: ${NOTIFICATIONS_WEBHOOK_URL:}
    base-url: ${NOTIFICATIONS_BASE_URL:http://localhost:4200}
  knowledge-gaps:
    # Unanswered questions grouped into gaps for reviewers (12d); "-" turns the weekly run off (manual detection stays).
    cron: ${KNOWLEDGE_GAPS_CRON:0 0 6 * * MON}
    lookback-days: 30
    similarity: 0.8
    min-questions: 2
    covered-similarity: 0.75
  specialists:
    # Supervisor + specialist agents (12f): default of the Settings toggle; off until measured with the evaluation.
    enabled: ${AGENT_SPECIALISTS:false}
    # Route by meaning when a message is this similar to a specialist's examples and this far ahead of the next one.
    min-similarity: 0.6
    min-margin: 0.03
    # When keywords and meaning are inconclusive, ask the chat model to choose (one extra, slow call on CPU).
    model-fallback: ${AGENT_SPECIALISTS_MODEL_FALLBACK:false}
  # Default of the Settings toggle: remind the model to search the knowledge base before answering or opening a ticket.
  grounding-check: true
  # Default of the Settings toggle: check answers and ticket requests against the retrieved articles.
  self-check: true
  memory:
    # Long conversations: once short-term memory holds more messages than this, older ones are summarized (0 = off).
    summarize-after: 12
    keep-recent: 4
  # Default of the Settings choice: model that reads screenshots (needs the vision capability). Empty = off.
  vision-model: ${AGENT_VISION_MODEL:}
  rag:
    similarity-threshold: 0.55
    top-k: 3
    index-on-startup: true
  guardrails:
    max-input-chars: 4000
    max-tool-output-chars: 6000
    blocked-patterns:
      - "ignore (all |any )?(the )?(previous|prior|above) (instructions|rules|prompts?)"
      - "disregard (all |any )?(the )?(previous|prior|above|system) (instructions|rules|prompts?)"
      - "(reveal|print|show|repeat) (me )?(your|the) (system prompt|instructions|hidden rules)"
      - "you are no longer (an? )?(it )?(helpdesk|assistant)"
      - "</?(system|assistant)>"
