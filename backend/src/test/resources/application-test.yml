agent:
  # Fixed test master key, so tests never write ~/.deskpilot.
  secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  # Rate limits have their own test; off for the others.
  rate-limit:
    per-minute: 0
    per-day: 0
  notifications:
    enabled: false
  # Tests script the model; the grounding check has its own tests that switch it on.
  grounding-check: false
  self-check: false
  # Routing is tested explicitly (SpecialistRouterTest, AgentOrchestratorTest); other tests keep the general agent.
  specialists:
    enabled: false
  rag:
    index-on-startup: false

management:
  otlp:
    metrics:
      export:
        # No Grafana in tests; meters are checked in the SimpleMeterRegistry.
        enabled: false
