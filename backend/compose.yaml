# Local dependencies, started automatically by Spring Boot (spring-boot-docker-compose) on `./mvnw spring-boot:run`.
name: deskpilot
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: deskpilot
      POSTGRES_USER: deskpilot
      POSTGRES_PASSWORD: deskpilot
    ports:
      # Random host port: avoids clashing with other local Postgres instances; Spring Boot discovers it.
      - "5432"
    volumes:
      - deskpilot-pgdata:/var/lib/postgresql/data
    labels:
      org.springframework.boot.service-connection: postgres

  # Identity provider (OIDC). Demo realm with users alice/alice (user), bob/bob (reviewer), admin/admin (admin).
  # Fixed port: the issuer URL must be the same for the browser and the backend.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/deskpilot-realm.json:/opt/keycloak/data/import/deskpilot-realm.json:ro

  # Trace viewer (OpenTelemetry/OTLP): one trace per agent run with its model and tool calls. UI: http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4318:4318"

  # Catches the notification e-mails (12j). Web UI: http://localhost:8026 (1025/8025 are often taken by other projects).
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1026:1025"
      - "8026:8025"

  # Grafana with Prometheus, Tempo and Loki behind one OTLP endpoint (12p). Optional, it needs ~1.5 GB of memory:
  #   docker compose --profile grafana up -d lgtm   and run the backend with OTEL_METRICS_EXPORT_ENABLED=true
  # Dashboard "DeskPilot — Agent" and alert rules at http://localhost:3000 (admin/admin); Jaeger is added as a data source.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["grafana"]
    ports:
      - "3000:3000"
      # OTLP over HTTP on 4328: Jaeger already listens on 4318.
      - "4328:4318"
    volumes:
      - ./grafana/dashboards:/deskpilot/dashboards:ro
      - ./grafana/provisioning/deskpilot-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/deskpilot.yaml:ro
      - ./grafana/provisioning/deskpilot-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/deskpilot.yaml:ro
      - ./grafana/provisioning/deskpilot-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/deskpilot.yaml:ro
      - ./grafana/provisioning/deskpilot-notifications.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/deskpilot-notifications.yaml:ro
      # E-mail only, or e-mail + chat webhook when GRAFANA_ALERT_WEBHOOK_URL is set (an empty URL would break provisioning).
      - ./grafana/provisioning/deskpilot-contacts${GRAFANA_ALERT_WEBHOOK_URL:+-webhook}.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/deskpilot-contacts.yaml:ro
    environment:
      # Alert notifications by e-mail through Mailpit (http://localhost:8026).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@deskpilot.local
      GF_SMTP_FROM_NAME: DeskPilot alerts
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      # Links in notifications ("Go to dashboard", "Silence") point here.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GRAFANA_ALERT_EMAILS: ${GRAFANA_ALERT_EMAILS:-admin@example.com}
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-}
      GRAFANA_ALERT_WEBHOOK_TYPE: ${GRAFANA_ALERT_WEBHOOK_TYPE:-slack}
    labels:
      # Not a service connection: traces keep going to Jaeger, metrics go to OTEL_METRICS_ENDPOINT.
      org.springframework.boot.ignore: "true"

volumes:
  deskpilot-pgdata:
