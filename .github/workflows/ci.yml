name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and integration tests; Postgres + pgvector comes from Testcontainers (Docker is available on the runner).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  images:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: deskpilot-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: deskpilot-frontend:ci

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/deskpilot_e2e
      OLLAMA_BASE_URL: http://localhost:11500
      E2E_BASE_URL: http://localhost:4300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # Postgres + pgvector and Keycloak with the demo realm (alice, bob, admin), as in backend/compose.yaml.
      - name: Start Postgres and Keycloak
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=deskpilot_e2e -e POSTGRES_USER=deskpilot -e POSTGRES_PASSWORD=deskpilot \
            pgvector/pgvector:pg17
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/backend/keycloak/deskpilot-realm.json:/opt/keycloak/data/import/deskpilot-realm.json:ro" \
            quay.io/keycloak/keycloak:26.3.3 start-dev --import-realm
      # The scripted model: no Ollama and no real model in CI.
      - name: Start the fake Ollama
        run: nohup node e2e/fake-ollama.mjs 11500 > fake-ollama.log 2>&1 &
      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package
      - name: Wait for Postgres and Keycloak
        run: |
          timeout 120 bash -c 'until docker exec postgres pg_isready -U deskpilot -d deskpilot_e2e; do sleep 2; done'
          timeout 180 bash -c 'until curl -sf http://localhost:8180/realms/deskpilot/.well-known/openid-configuration > /dev/null; do sleep 3; done'
      - name: Start the backend (profile e2e, port 8090)
        working-directory: backend
        run: |
          SPRING_PROFILES_ACTIVE=e2e nohup java -jar "$(ls target/deskpilot-*.jar | head -1)" > ../backend.log 2>&1 &
          timeout 180 bash -c 'until curl -s http://localhost:8090/actuator/health > /dev/null; do sleep 3; done'
      - name: Start the frontend (port 4300)
        working-directory: frontend
        run: |
          npm ci
          nohup npx ng serve --port 4300 --proxy-config ../e2e/proxy.e2e.json > ../frontend.log 2>&1 &
          timeout 300 bash -c 'until curl -sf http://localhost:4300/ > /dev/null; do sleep 3; done'
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload the report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend.log
            frontend.log
            fake-ollama.log
          retention-days: 7
